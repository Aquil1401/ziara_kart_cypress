name: Cypress Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # Enables Cross-Repository Trigger from Development/Application Repo
  repository_dispatch:
    types: [run-regression-tests, test]
  # Allows manual triggering with optional custom target URL
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target Application URL (e.g. Preview/Staging URL)'
        required: false
        default: 'https://ziarakart.vercel.app'

jobs:
  cypress-run:
    name: Run Cypress Tests & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci || npm install

      - name: Run Cypress Tests & Generate Report
        env:
          CI: true
          BASE_URL: ${{ github.event.inputs.target_url || github.event.client_payload.target_url || secrets.BASE_URL || 'https://ziarakart.vercel.app' }}
        run: npm run test:ci || npx cypress run --headless --browser chrome

      - name: Upload Cypress HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-html-report
          path: cypress/reports/html
          retention-days: 15

      - name: Upload Cypress Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: cypress/screenshots
          retention-days: 15

      - name: Upload Cypress Videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: cypress/videos
          retention-days: 15
